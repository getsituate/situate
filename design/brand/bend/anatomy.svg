<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="anatomy-title anatomy-desc">
<title id="anatomy-title">Bend construction and paint order</title>
<desc id="anatomy-desc">The two arm origins sit inside the opaque body. Rear arms are painted before the depth, front, highlight and inset. The face stays on the crown. The lower opening stays empty.</desc>
<rect width="960" height="650" rx="20" fill="#fff7e3"/>
<g font-family="system-ui, sans-serif" fill="#30203e">
<text x="36" y="48" font-size="26" font-weight="700">One open arch. Two hidden arm origins.</text>
<text x="36" y="78" font-size="15">Coordinates use the unscaled 320 × 320 character canvas.</text>
<g transform="translate(35 120)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" aria-hidden="true" focusable="false" data-bend-pose="wave" data-bend-expression="welcome">

<defs>
<clipPath id="anatomy-character-left-exterior" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="124" height="320"/></clipPath>
<clipPath id="anatomy-character-right-exterior" clipPathUnits="userSpaceOnUse"><rect x="195" y="0" width="125" height="320"/></clipPath>
</defs>
<g data-bend-part="figure" style="transform-box:view-box;transform-origin:160px 270px">
<g data-bend-part="rear-arms"><g clip-path="url(#anatomy-character-left-exterior)"><g data-bend-part="left-arm" data-bend-origin="103 169" style="transform-box:view-box;transform-origin:103px 169px"><path d="M103 169C79 173 65 187 59 208" fill="none" stroke="#a77bff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></g></g><g clip-path="url(#anatomy-character-right-exterior)"><g data-bend-part="right-arm" data-bend-origin="225 169" style="transform-box:view-box;transform-origin:225px 169px"><path d="M225 169C253 169 276 149 267 127m0 0-3-12m3 12 8-7" fill="none" stroke="#a77bff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>
<g data-bend-part="body">
<path data-bend-part="depth" d="M105 270V148c0-82 131-89 136-3l2 113c0 15-13 21-23 15l-9-8-2-115c-1-33-84-30-85 2v110c0 15-9 24-19 8Z" fill="#56329b"/>
<path data-bend-part="front" d="M91 264V141c0-82 132-88 136-2l2 112c0 17-30 19-31 3l-3-111c-1-33-71-29-71 3v115c0 19-33 22-33 3Z" fill="#a77bff"/>
<path data-bend-part="highlight" d="M101 257V142c0-35 22-61 54-64" fill="none" stroke="#d9c6ff" stroke-width="3" stroke-linecap="round"/>
<path data-bend-part="inset" d="M204 143l2 106" fill="none" stroke="#7045bd" stroke-width="2" stroke-linecap="round"/>
</g>
<g data-bend-part="face" fill="none" stroke="#30203e" stroke-linecap="round" stroke-linejoin="round" style="transform-box:view-box;transform-origin:160px 100px"><path d="M142 88q4-3 8-1m20 0q4-2 8 1" stroke-width="2.4"/><path d="M147 97v6m27-6v6" stroke-width="5.5"/><path d="M151 110q10 11 20-1" stroke-width="3.2"/></g>
<g data-bend-part="prop"></g>
</g>
</svg>

<g fill="none" stroke="#30203e" stroke-width="1" stroke-dasharray="3 3">
<rect x="138" y="79" width="44" height="41"/><path d="M91 145V275M124 145V275M195 145V275M243 145V275M35 169H290"/>
</g>
<g fill="#fff7e3" stroke="#30203e" stroke-width="1.5"><circle cx="103" cy="169" r="4"/><circle cx="225" cy="169" r="4"/></g>
<path d="M103 169 55 105H0M225 169 267 214H320M160 120V48H240" fill="none" stroke="#30203e"/>
<g font-size="12"><text x="0" y="99">103, 169</text><text x="259" y="232">225, 169</text><text x="244" y="51">Face box</text><text x="126" y="290">Open below</text></g>
</g>
<g transform="translate(445 133)" font-size="16">
<text x="0" y="0" font-size="20" font-weight="700">Back → front</text>
<g transform="translate(0 25)"><rect width="32" height="22" rx="7" fill="#a77bff"/><text x="48" y="17">1. Rear arms, clipped outside the opening</text></g>
<g transform="translate(0 70)"><rect width="32" height="22" rx="7" fill="#56329b"/><text x="48" y="17">2. Opaque extruded depth</text></g>
<g transform="translate(0 115)"><rect width="32" height="22" rx="7" fill="#a77bff"/><text x="48" y="17">3. Opaque front surface</text></g>
<g transform="translate(0 160)"><rect width="32" height="22" rx="7" fill="#d9c6ff"/><text x="48" y="17">4. Outer highlight, then inner inset</text></g>
<g transform="translate(0 205)"><rect width="32" height="22" rx="7" fill="#30203e"/><text x="48" y="17">5. Face on the crown</text></g>
<g transform="translate(0 250)"><rect width="32" height="22" rx="7" fill="#f4f06d"/><text x="48" y="17">6. Optional prop and gripping hands</text></g>
</g>
<path d="M36 476H924" stroke="#ad9284"/>
<text x="36" y="517" font-size="18" font-weight="700">An origin is not a visible shoulder stroke.</text>
<text x="36" y="548" font-size="16">At y = 169, the left surface spans x = 91–124; the right opaque silhouette spans ≈196–241.</text>
<text x="36" y="577" font-size="16">The body covers both 13-unit round caps. Rotation happens around these same fixed origins.</text>
<text x="36" y="606" font-size="16">Never bring a rear-arm group above the body. A book may cross the opening; anatomy never closes it.</text>
</g>
</svg>
