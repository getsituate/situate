# Only the Vue app's TypeScript and Vue sources have a CI coverage report.
# Exclude sibling directories from coverage without removing them from static analysis.
sonar.coverage.exclusions=\
  *,\
  .github/**,.pi/**,LICENSES/**,changes/**,design/**,docs/**,infrastructure/**,releases/**,requirements/**,tools/**,website/**,\
  client/*,client/contracts/**,client/crates/**,client/docker/**,client/packages/**,client/scripts/**,client/workshop/**,\
  client/app/*,client/app/public/**,client/app/src-tauri/**,client/app/tests/**,\
  client/app/src/**/*.test.ts,client/app/src/**/*.d.ts,\
  client/app/src/**/*.js,client/app/src/**/*.html,client/app/src/**/*.css,client/app/src/**/*.json,\
  client/app/src/**/*.md,client/app/src/**/*.svg,client/app/src/**/*.txt
