name: Linux CI image
description: Validate the reviewed image lock and pull its immutable image.
inputs:
  directory:
    description: Checkout containing the image lock and recipe
    default: .
outputs:
  image:
    description: Digest-pinned image reference
    value: ${{ steps.image.outputs.image }}
runs:
  using: composite
  steps:
    - id: image
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        node --input-type=module -e 'import {readImageLock} from "./tools/ci-image.mjs"; console.log("image=" + readImageLock().image)' >> "$GITHUB_OUTPUT"
    - name: Free unused hosted runner SDKs
      if: runner.environment == 'github-hosted' && runner.os == 'Linux'
      shell: bash
      run: |
        df -h /
        sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
    - name: Authenticate for the private repository image
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ github.token }}
        REGISTRY_ACTOR: ${{ github.actor }}
      run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
    - shell: bash
      env:
        CI_IMAGE: ${{ steps.image.outputs.image }}
      run: docker pull "$CI_IMAGE"
