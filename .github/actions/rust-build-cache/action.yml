name: Rust build outputs
description: Reuse compatible build outputs; only successful trusted main runs may save.
inputs:
  phase:
    description: restore before building or save after successful checks
    default: restore
  group:
    description: Required on restore; job family and build profile
    default: ""
  toolchain:
    description: Rust toolchain fingerprint; override when using a compiler other than the repository pin
    default: ${{ hashFiles('client/rust-toolchain.toml') }}
  image:
    description: CI image fingerprint; hosted runner image identity is also included automatically
    default: ${{ runner.os != 'Linux' && runner.os || hashFiles('tools/ci-image.lock.json') }}
  revision:
    description: SHA-256 lockfile and build configuration fingerprint
    default: ${{ hashFiles('client/**/Cargo.toml', 'client/**/Cargo.lock', 'client/**/package.json', 'client/package-lock.json', 'client/rust-toolchain.toml', 'client/.node-version', 'client/**/.cargo/config*', '.cargo/config*', 'client/docker/Dockerfile', 'tools/ci-container.mjs', '!client/**/node_modules/**', '!client/**/target/**') }}
  platform:
    description: Build platform (override for container builds)
    default: ${{ runner.os }}
  arch:
    description: Build architecture (override for container builds)
    default: ${{ runner.arch }}
  source-sha:
    description: Full commit SHA of the source being built
    default: ${{ github.sha }}
  workshop:
    description: Include client/workshop/dist; callers must still run normal build freshness checks
    default: "false"
  key:
    description: Exact key from the restore invocation; required for save
    default: ""
  hit:
    description: Exact hit from the restore invocation
    default: "false"
outputs:
  key:
    description: Capture this key before building and pass it unchanged to save
    value: ${{ steps.identity.outputs.key }}
  hit:
    description: Whether the exact source cache was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: identity
      shell: bash
      env:
        CACHE_PHASE: ${{ inputs.phase }}
        CACHE_GROUP: ${{ inputs.group }}
        CACHE_TOOLCHAIN: ${{ inputs.toolchain }}
        CACHE_IMAGE: ${{ inputs.image }}
        CACHE_REVISION: ${{ inputs.revision }}
        CACHE_PLATFORM: ${{ inputs.platform }}
        CACHE_ARCH: ${{ inputs.arch }}
        CACHE_RUNNER_OS: ${{ runner.os }}
        CACHE_RUNNER_ARCH: ${{ runner.arch }}
        CACHE_JOB: ${{ github.job }}
        CACHE_SOURCE: ${{ inputs.source-sha }}
        CACHE_WORKSHOP: ${{ inputs.workshop }}
        CACHE_KEY: ${{ inputs.key }}
      run: |
        node --input-type=module <<'NODE'
        import { createHash } from 'node:crypto';
        import { appendFileSync } from 'node:fs';
        const env = process.env;
        if (!['restore', 'save'].includes(env.CACHE_PHASE)) throw new Error('Invalid cache phase');
        if (!['true', 'false'].includes(env.CACHE_WORKSHOP)) throw new Error('Invalid workshop setting');
        let key;
        let prefix = '';
        if (env.CACHE_PHASE === 'save') {
          key = env.CACHE_KEY;
          if (!/^rust-build-v1-[a-f0-9]{64}-(?:[a-f0-9]{40}|[a-f0-9]{64})$/.test(key ?? '')) {
            throw new Error('Save requires the key captured during restore');
          }
        } else {
          const fields = ['CACHE_GROUP', 'CACHE_TOOLCHAIN', 'CACHE_IMAGE', 'CACHE_REVISION',
            'CACHE_PLATFORM', 'CACHE_ARCH', 'CACHE_RUNNER_OS', 'CACHE_RUNNER_ARCH', 'CACHE_JOB', 'CACHE_WORKSHOP'];
          if (fields.some(field => !env[field]?.trim())) throw new Error('Missing cache identity input');
          if (!/^[a-f0-9]{64}$/.test(env.CACHE_REVISION)) throw new Error('Expected SHA-256 revision');
          if (!/^(?:[a-f0-9]{40}|[a-f0-9]{64})$/.test(env.CACHE_SOURCE)) throw new Error('Expected full source SHA');
          const flags = Object.keys(env).filter(name =>
            /^(?:CARGO_PROFILE_[A-Z0-9_]+|CARGO_TARGET_[A-Z0-9_]+_(?:RUSTFLAGS|LINKER)|CARGO_(?:ENCODED_RUSTFLAGS|ENCODED_RUSTDOCFLAGS|INCREMENTAL|BUILD_(?:TARGET|RUSTFLAGS|RUSTDOCFLAGS|RUSTC|RUSTC_WRAPPER))|RUSTFLAGS|RUSTDOCFLAGS|RUSTUP_TOOLCHAIN|RUSTC(?:_WRAPPER|_WORKSPACE_WRAPPER)?|DEVELOPER_DIR|CC|CXX|CFLAGS|CXXFLAGS|LDFLAGS)$/.test(name)
          ).sort().map(name => [name, env[name]]);
          const identity = [fields.map(field => env[field]), env.ImageOS ?? '', env.ImageVersion ?? '', flags];
          const digest = createHash('sha256').update(JSON.stringify(identity)).digest('hex');
          prefix = `rust-build-v1-${digest}-`;
          key = `${prefix}${env.CACHE_SOURCE}`;
        }
        appendFileSync(env.GITHUB_OUTPUT, `key=${key}\nprefix=${prefix}\n`);
        NODE
    - id: restore
      if: inputs.phase == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          client/target/debug
          client/target/release
          client/target/*-*/debug
          client/target/*-*/release
          client/workshop/src-tauri/target/debug
          client/workshop/src-tauri/target/release
          ${{ inputs.workshop == 'true' && 'client/workshop/dist' || '' }}
          !client/**/target/**/incremental
          !client/**/target/**/bundle
          !client/**/target/**/.cargo-lock
          !client/target/agent-e2e-*
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.prefix }}
    - name: Save successful build outputs
      if: >-
        success() && inputs.phase == 'save' && inputs.hit != 'true' &&
        github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' &&
        (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          client/target/debug
          client/target/release
          client/target/*-*/debug
          client/target/*-*/release
          client/workshop/src-tauri/target/debug
          client/workshop/src-tauri/target/release
          ${{ inputs.workshop == 'true' && 'client/workshop/dist' || '' }}
          !client/**/target/**/incremental
          !client/**/target/**/bundle
          !client/**/target/**/.cargo-lock
          !client/target/agent-e2e-*
        key: ${{ steps.identity.outputs.key }}
