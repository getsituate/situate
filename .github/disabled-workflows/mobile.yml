# Android and iOS builds and device verification are not a current development focus.
# Keep this workflow outside .github/workflows until mobile CI is resumed.
name: Mobile platforms

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  android:
    name: Android instrumentation, lint and smoke
    runs-on: [self-hosted, Linux, X64, situate-android]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: volta-cli/action@5c175f92dea6f48441c436471e6479dbc192e194
        with:
          volta-version: 2.0.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --prefix client
      - name: Check provisioned Android build inputs
        run: |
          test -n "$ANDROID_HOME"
          command -v avdmanager
          test -r /dev/kvm && test -w /dev/kvm
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/platform-tools/adb"
          avd_root=$(mktemp -d "$RUNNER_TEMP/situate-avd.XXXXXX")
          {
            echo "ANDROID_AVD_HOME=$avd_root"
            echo "AVD_NAME=situate-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "ANDROID_SERIAL=emulator-5554"
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
          } >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build generated Android project
        working-directory: client
        run: |
          rustup target add x86_64-linux-android
          npm run tauri -- android init --ci --skip-targets-install --config src-tauri/tests/smoke.conf.json
          npm run tauri -- android build --ci --debug --target x86_64 --apk --features native-smoke --config src-tauri/tests/smoke.conf.json
      - name: Start isolated emulator
        run: |
          echo no | avdmanager create avd --name "$AVD_NAME" --package 'system-images;android-35;google_apis;x86_64'
          python3 - <<'PY'
          import os, pathlib, socket, subprocess, time
          serial, name = os.environ['ANDROID_SERIAL'], os.environ['AVD_NAME']
          devices = subprocess.check_output(['adb', 'devices'], text=True, timeout=10)
          if any(line.split()[0] == serial for line in devices.splitlines()[1:] if line.split()):
              raise SystemExit('Refusing to reuse existing emulator ' + serial)
          with socket.socket() as console, socket.socket() as bridge:
              console.bind(('127.0.0.1', 5554))
              bridge.bind(('127.0.0.1', 5555))
          artifacts = pathlib.Path('test-results/android')
          artifacts.mkdir(parents=True, exist_ok=True)
          with (artifacts / 'emulator.log').open('w') as log:
              child = subprocess.Popen([os.environ['ANDROID_HOME'] + '/emulator/emulator', '-avd', name, '-port', '5554', '-no-window', '-no-audio', '-no-boot-anim', '-no-snapshot', '-gpu', 'swiftshader_indirect'], stdout=log, stderr=subprocess.STDOUT)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('EMULATOR_STARTED=true\n')
          deadline = time.monotonic() + 300
          while time.monotonic() < deadline:
              if child.poll() is not None:
                  raise SystemExit('Owned Android emulator exited before boot')
              identity = subprocess.run(['adb', '-s', serial, 'emu', 'avd', 'name'], capture_output=True, text=True, timeout=10)
              if identity.returncode == 0:
                  if identity.stdout.splitlines()[0] != name:
                      raise SystemExit('Emulator identity does not match the owned AVD')
                  result = subprocess.run(['adb', '-s', serial, 'shell', 'getprop', 'sys.boot_completed'], capture_output=True, text=True, timeout=10)
                  if result.returncode == 0 and result.stdout.strip() == '1':
                      break
              time.sleep(2)
          else:
              raise SystemExit('Android emulator did not boot within 300 seconds')
          PY
      - name: Run plugin instrumentation and Android lint
        working-directory: client/app/src-tauri/gen/android
        run: |
          actual=$(adb -s "$ANDROID_SERIAL" emu avd name)
          test "${actual%%$'\n'*}" = "$AVD_NAME"
          connected=$(adb devices | awk 'NR > 1 && NF {print $1}')
          test "$connected" = "$ANDROID_SERIAL"
          ./gradlew :tauri-plugin-workspace-access:connectedDebugAndroidTest :tauri-plugin-workspace-access:lintDebug :app:lintDebug --no-daemon
      - name: Require instrumentation results
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path('client/crates/tauri-plugin-workspace-access/android/build/outputs/androidTest-results').rglob('TEST-*.xml'))
          count = sum(int(ET.parse(report).getroot().get('tests', '0')) for report in reports)
          if count == 0:
              raise SystemExit('Android instrumentation produced no test cases')
          PY
      - name: Require fresh Android smoke reports on both launches
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time
          bundle = 'dev.situate.client.smoke'
          def run(*args):
              return subprocess.check_output(args, text=True, timeout=30).strip()
          def adb(*args):
              serial = os.environ['ANDROID_SERIAL']
              identity = run('adb', '-s', serial, 'emu', 'avd', 'name').splitlines()
              if not identity or identity[0] != os.environ['AVD_NAME']:
                  raise SystemExit('Refusing to operate on an emulator not owned by this job')
              return run('adb', '-s', serial, *args)
          aapt = str(pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/aapt2')
          matches = []
          for apk in pathlib.Path('client/app/src-tauri/gen/android/app/build/outputs/apk').rglob('*.apk'):
              badging = run(aapt, 'dump', 'badging', str(apk))
              package = re.search(r"^package: name='([^']+)'", badging, re.M)
              activity = re.search(r"^launchable-activity: name='([^']+)'", badging, re.M)
              if package and package[1] == bundle and activity and 'application-debuggable' in badging:
                  matches.append((apk, activity[1]))
          if len(matches) != 1:
              raise SystemExit('Expected exactly one debuggable smoke APK, found ' + str(len(matches)))
          apk, activity = matches[0]
          adb('install', '--no-streaming', str(apk))
          if adb('shell', 'pm', 'clear', bundle) != 'Success':
              raise SystemExit('Could not reset the isolated smoke application')
          def reports():
              return adb('shell', 'run-as', bundle, 'find', '.', '-name', 'smoke-result.json', '-type', 'f').splitlines()
          for phase in range(2):
              adb('shell', 'am', 'force-stop', bundle)
              for report in reports():
                  adb('shell', 'run-as', bundle, 'rm', '--', report)
              launched = adb('shell', 'am', 'start', '-W', '-n', bundle + '/' + activity)
              if 'Status: ok' not in launched:
                  raise SystemExit('Smoke activity did not start: ' + launched)
              deadline = time.monotonic() + 120
              while time.monotonic() < deadline:
                  paths = reports()
                  if len(paths) > 1:
                      raise SystemExit('Multiple smoke reports in the application sandbox')
                  if paths:
                      raw = adb('shell', 'run-as', bundle, 'cat', paths[0])
                      destination = pathlib.Path('test-results/android') / ('launch-' + str(phase + 1))
                      destination.mkdir(parents=True, exist_ok=True)
                      (destination / 'smoke-result.json').write_text(raw)
                      try:
                          result = json.loads(raw)
                      except json.JSONDecodeError:
                          time.sleep(0.2)
                          continue
                      if result.get('passed') is not True:
                          raise SystemExit('Android smoke launch failed: ' + json.dumps(result))
                      break
                  time.sleep(1)
              else:
                  raise SystemExit('No fresh Android smoke report for launch ' + str(phase + 1))
              adb('shell', 'am', 'force-stop', bundle)
          PY
      - name: Retain Android job diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-test-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/android/
            client/crates/tauri-plugin-workspace-access/android/build/outputs/androidTest-results/**/*.xml
            client/crates/tauri-plugin-workspace-access/android/build/reports/lint-results-*.xml
            client/crates/tauri-plugin-workspace-access/android/build/reports/lint-results-*.html
            client/crates/tauri-plugin-workspace-access/android/build/reports/lint-results-*.txt
            client/app/src-tauri/gen/android/app/build/reports/lint-results-*.xml
            client/app/src-tauri/gen/android/app/build/reports/lint-results-*.html
            client/app/src-tauri/gen/android/app/build/reports/lint-results-*.txt
      - name: Stop owned emulator
        if: always() && env.EMULATOR_STARTED == 'true'
        run: |
          actual=$(adb -s "$ANDROID_SERIAL" emu avd name)
          test "${actual%%$'\n'*}" = "$AVD_NAME"
          adb -s "$ANDROID_SERIAL" emu kill
          avdmanager delete avd --name "$AVD_NAME"

  ios:
    name: iOS Simulator smoke
    runs-on: [self-hosted, macOS, ARM64, situate-ios]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: volta-cli/action@5c175f92dea6f48441c436471e6479dbc192e194
        with:
          volta-version: 2.0.2
      - name: Check Apple build prerequisites
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcodegen --version
          pod --version
          test "$(uname -m)" = arm64
      - run: npm ci --prefix client
      - name: Build smoke application
        working-directory: client
        run: |
          rustup target add aarch64-apple-ios-sim
          npm run tauri -- ios init --ci --skip-targets-install --config src-tauri/tests/smoke.conf.json
          npm run tauri -- ios build --ci --debug --target aarch64-sim --no-sign --features native-smoke --config src-tauri/tests/smoke.conf.json
      - name: Create and boot an isolated simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          def listing(kind):
              return json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', kind, '--json']))[kind]
          runtimes = [r for r in listing('runtimes') if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not runtimes:
              raise SystemExit('Missing available iOS Simulator runtime')
          runtime = sorted(runtimes, key=lambda r: tuple(map(int, r['version'].split('.'))))[-1]
          types = [d for d in listing('devicetypes') if d['name'].startswith('iPhone')]
          if not types:
              raise SystemExit('Missing iPhone simulator device type')
          device = subprocess.check_output(['xcrun', 'simctl', 'create', 'Situate CI ' + os.environ['GITHUB_RUN_ID'], types[-1]['identifier'], runtime['identifier']], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + device + '\n')
          subprocess.run(['xcrun', 'simctl', 'boot', device], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device, '-b'], check=True, timeout=300)
          PY
      - name: Require fresh passing reports on both launches
        run: |
          python3 - <<'PY'
          import json, os, pathlib, plistlib, subprocess, time
          device, bundle = os.environ['SIMULATOR_ID'], 'dev.situate.client.smoke'
          def sim(*args):
              return subprocess.check_output(['xcrun', 'simctl', *args], text=True).strip()
          output = pathlib.Path('client/app/src-tauri/gen/apple/build/arm64-sim')
          matches = []
          for app in output.glob('*.app'):
              with (app / 'Info.plist').open('rb') as source:
                  if plistlib.load(source).get('CFBundleIdentifier') == bundle:
                      matches.append(app)
          if len(matches) != 1:
              raise SystemExit('Expected exactly one smoke app bundle, found ' + str(len(matches)))
          app = matches[0]
          sim('install', device, str(app))
          container = pathlib.Path(sim('get_app_container', device, bundle, 'data'))
          for phase in range(2):
              for report in container.rglob('smoke-result.json'):
                  report.unlink()
              sim('launch', device, bundle)
              deadline = time.monotonic() + 120
              while time.monotonic() < deadline:
                  reports = list(container.rglob('smoke-result.json'))
                  if len(reports) > 1:
                      raise SystemExit('Multiple smoke reports in the application sandbox')
                  if reports:
                      raw = reports[0].read_text()
                      destination = pathlib.Path('test-results/ios') / ('launch-' + str(phase + 1))
                      destination.mkdir(parents=True, exist_ok=True)
                      (destination / 'smoke-result.json').write_text(raw)
                      try:
                          result = json.loads(raw)
                      except json.JSONDecodeError:
                          time.sleep(0.2)
                          continue
                      if result.get('passed') is not True:
                          raise SystemExit('Smoke launch failed: ' + json.dumps(result))
                      break
                  time.sleep(1)
              else:
                  raise SystemExit('No fresh smoke report for launch ' + str(phase + 1))
              sim('terminate', device, bundle)
          PY
      - name: Retain iOS smoke reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-test-results
          path: test-results/ios/
          retention-days: 7
          if-no-files-found: warn
      - name: Delete isolated simulator
        if: always() && env.SIMULATOR_ID != ''
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID"
          xcrun simctl delete "$SIMULATOR_ID"

  required:
    name: Required mobile quality
    if: always()
    needs: [android, ios]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both platforms
        env:
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: test "$ANDROID" = success && test "$IOS" = success
