version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /client
      - /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directories:
      - /client
      - /tools/dev-tui
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
