name: Publish macOS

on:
  workflow_run:
    workflows: [Release macOS]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact completed GitHub Release ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-macos
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'getsituate/situate' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'getsituate/situate' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    runs-on: macos-latest
    environment: macos-publication
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      PIPELINE_RELEASE_ENABLED: ${{ vars.MACOS_PUBLICATION_ENABLED }}
      PIPELINE_CONFIGURATION_SHA256: ${{ vars.MACOS_PUBLICATION_CONFIGURATION_SHA256 }}
      PIPELINE_DESTINATION: ${{ vars.MACOS_RELEASE_DESTINATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs release-gate --workflow publish
      - id: plan
        run: node tools/actions-adapter.mjs publish-prepare --workflow publish
        env:
          PIPELINE_RELEASE_ID: ${{ inputs.release_id }}
          PIPELINE_CONFIGURATION_JSON: ${{ secrets.MACOS_PUBLICATION_CONFIGURATION_JSON }}
          GH_TOKEN: ${{ github.token }}
      - run: node tools/actions-adapter.mjs publish-run --workflow publish
        if: steps.plan.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.MACOS_PUBLICATION_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.MACOS_PUBLICATION_SSH_KNOWN_HOSTS }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SITUATE_UPDATER_PUBLIC_KEY: ${{ vars.SITUATE_UPDATER_PUBLIC_KEY }}
