name: Release launch trace

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Existing creation operation
        required: true
        type: string
      checkpoint:
        description: Original build checkpoint
        required: true
        type: string
      confirmation:
        description: Fresh inspection digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  trace:
    if: github.repository == 'getsituate/situate' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: release-recovery
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: situate-release-effects
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      RECOVERY_WORKFLOW: create
      RECOVERY_ACTION: qualify
      RECOVERY_OPERATION: ${{ inputs.operation }}
      RECOVERY_CHECKPOINT: ${{ inputs.checkpoint }}
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      WEBSITE_DEPLOY_HOST: ${{ vars.WEBSITE_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs desktop
      - run: node tools/actions-adapter.mjs launch-trace
        env:
          GH_TOKEN: ${{ github.token }}
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.SITUATE_RELEASE_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.SITUATE_RELEASE_SSH_KNOWN_HOSTS }}
