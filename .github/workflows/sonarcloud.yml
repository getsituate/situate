name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      vars.SONAR_CI_ANALYSIS == 'true' &&
      (github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/npm-ci.mjs client
      - name: Measure Vue coverage
        working-directory: client/app
        run: node ../../tools/run-coordinated.mjs -- node ../node_modules/vitest/vitest.mjs run --allowOnly=false --coverage
      - name: Resolve LCOV paths from the repository root
        run: |
          awk '
            /^SF:/ {
              if ($0 !~ /^SF:src\//) exit 1
              sub(/^SF:/, "SF:client/app/")
              sources++
            }
            { print }
            END { if (!sources) exit 1 }
          ' client/target/coverage/vue/lcov.info > "$RUNNER_TEMP/situate-vue.lcov"
      - name: Publish analysis and Vue coverage
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=getsituate
            -Dsonar.projectKey=getsituate_situate
            -Dsonar.javascript.lcov.reportPaths=${{ runner.temp }}/situate-vue.lcov
