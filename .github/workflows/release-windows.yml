name: Build Windows release candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reserved stable Windows version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-candidate
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'getsituate/situate' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: windows-2025
    timeout-minutes: 75
    environment: windows-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python tools/pipeline-bootstrap.py
      - shell: pwsh
        run: ./tools/build-windows-installer-preview.ps1
        env:
          SITUATE_WINDOWS_RELEASE_VERSION: ${{ inputs.version }}
          SITUATE_WINDOWS_INSTALLER_TARGET: ${{ matrix.target }}
          SITUATE_UPDATER_PUBLIC_KEY: ${{ vars.SITUATE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swp/release/
          if-no-files-found: error
          retention-days: 7
