name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  website:
    if: github.repository == 'getsituate/situate' && github.ref == 'refs/heads/main' && vars.HOSTING_PRODUCTION_ENABLED == 'true' && vars.WEBSITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 185
    environment: website-production
    permissions:
      actions: read
      contents: read
      deployments: read
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/wait-for-hosting.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node website/site.mjs --build
        env:
          SITUATE_POSTHOG_TOKEN: ${{ vars.SITUATE_POSTHOG_TOKEN }}
      - run: python3 tools/pipeline-container.py website prepared website/dist
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-visual-report
          path: test-results/website-visual/
          if-no-files-found: ignore
          retention-days: 7
      - run: node tools/wait-for-hosting.mjs --check
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python3 infrastructure/production/immutable/website_content.py deploy website/dist "$WEBSITE_SOURCE_REVISION"
        env:
          WEBSITE_SOURCE_REVISION: ${{ github.sha }}
          WEBSITE_CONTENT_KNOWN_HOSTS: ${{ vars.WEBSITE_CONTENT_KNOWN_HOSTS }}
          WEBSITE_CONTENT_SSH_KEY: ${{ secrets.WEBSITE_CONTENT_SSH_KEY }}
