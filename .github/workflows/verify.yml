name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      digest: ${{ steps.plan.outputs.digest }}
      app_impact: ${{ steps.plan.outputs.app_impact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 tools/pipeline-container.py actions plan --workflow verify
        env:
          GH_TOKEN: ${{ github.event_name == 'merge_group' && github.token || '' }}

  policy:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).lanes.*.id, 'policy')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane policy

  tooling:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).lanes.*.id, 'tooling')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane tooling

  tooling-macos:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).lanes.*.id, 'tooling-macos')
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane tooling-macos
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane tooling-macos

  docker-integration:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).lanes.*.id, 'docker-integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane docker-integration
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane docker-integration

  frontend:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).lanes.*.id, 'frontend')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane frontend

  rust:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).lanes.*.id, 'rust')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane rust

  macos-code:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).lanes.*.id, 'macos-code')
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane macos-code
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane macos-code

  browser:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).lanes.*.id, 'browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane browser
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-visual-report
          path: test-results/website-visual/
          if-no-files-found: ignore
          retention-days: 7

  macos-native:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.plan).lanes.*.id, 'macos-native')
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      SITUATE_TOOL_BUILD_SLOTS: "1"
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs desktop
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane macos-native
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane macos-native

  required:
    name: PR verification
    needs:
      [
        plan,
        policy,
        tooling,
        tooling-macos,
        docker-integration,
        frontend,
        rust,
        macos-code,
        browser,
        macos-native,
      ]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-container.py actions aggregate --workflow verify
        env:
          PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
          PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
          PIPELINE_NEEDS: ${{ format('{{"plan":{{"result":{0}}},"policy":{1},"tooling":{2},"tooling-macos":{3},"docker-integration":{4},"frontend":{5},"rust":{6},"macos-code":{7},"browser":{8},"macos-native":{9}}}', toJSON(needs.plan.result), toJSON(needs.policy), toJSON(needs.tooling), toJSON(needs.tooling-macos), toJSON(needs.docker-integration), toJSON(needs.frontend), toJSON(needs.rust), toJSON(needs.macos-code), toJSON(needs.browser), toJSON(needs.macos-native)) }}
      - run: python3 tools/pipeline-bootstrap.py
      - id: evidence
        run: node tools/actions-adapter.mjs source-evidence --workflow verify
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
          PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
          PIPELINE_NEEDS: ${{ format('{{"plan":{{"result":{0}}},"policy":{1},"tooling":{2},"tooling-macos":{3},"docker-integration":{4},"frontend":{5},"rust":{6},"macos-code":{7},"browser":{8},"macos-native":{9}}}', toJSON(needs.plan.result), toJSON(needs.policy), toJSON(needs.tooling), toJSON(needs.tooling-macos), toJSON(needs.docker-integration), toJSON(needs.frontend), toJSON(needs.rust), toJSON(needs.macos-code), toJSON(needs.browser), toJSON(needs.macos-native)) }}
      - if: steps.evidence.outputs.created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-digest: sha256:${{ steps.evidence.outputs.sha256 }}
          subject-name: evidence.json
          create-storage-record: false
      - id: evidence_artifact
        if: steps.evidence.outputs.created == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-verification-${{ github.run_attempt }}/evidence.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - if: steps.evidence.outputs.created == 'true'
        run: node tools/actions-adapter.mjs source-evidence-check --workflow verify
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
          PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
          PIPELINE_SOURCE_ARTIFACT_ID: ${{ steps.evidence_artifact.outputs.artifact-id }}
          PIPELINE_SOURCE_ARTIFACT_SHA256: ${{ steps.evidence_artifact.outputs.artifact-digest }}
          PIPELINE_SOURCE_EVIDENCE_FILE: ${{ steps.evidence.outputs.path }}
