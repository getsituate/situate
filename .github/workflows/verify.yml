name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      lanes: ${{ steps.plan.outputs.lanes }}
      digest: ${{ steps.plan.outputs.digest }}
      app_impact: ${{ steps.plan.outputs.app_impact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: python3 tools/pipeline-container.py actions plan --workflow verify
        env:
          GH_TOKEN: ${{ github.event_name == 'merge_group' && github.token || '' }}

  policy:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'policy')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane policy

  tooling:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'tooling')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane tooling

  tooling-macos:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'tooling-macos')
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane tooling-macos
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane tooling-macos

  docker-integration:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'docker-integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane docker-integration
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane docker-integration

  frontend:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'frontend')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane frontend

  rust:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'rust')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane rust

  macos-code:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'macos-code')
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane macos-code
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane macos-code

  browser:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane browser
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-visual-report
          path: test-results/website-visual/
          if-no-files-found: ignore
          retention-days: 7

  browser-webkit:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'browser-webkit')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow verify --lane browser-webkit

  macos-native:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'macos-native')
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      SITUATE_TOOL_BUILD_SLOTS: "1"
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs desktop
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane macos-native
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane macos-native

  macos-compatibility:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'macos-compatibility')
    runs-on: macos-15-intel
    timeout-minutes: 60
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SITUATE_TOOL_BUILD_SLOTS: "1"
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs desktop
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane macos-compatibility
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane macos-compatibility

  windows-native:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'windows-native')
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs setup --workflow verify --lane windows-native
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow verify --lane windows-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-ci-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/situate-windows-ci/artifact/
          if-no-files-found: error
          retention-days: 7

  windows-smoke-build:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'windows-support'
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python tools/pipeline-bootstrap.py
      - run: node tools/build-windows-smoke.mjs windows-smoke-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-smoke-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: windows-smoke-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Build unsigned installer preview
        shell: pwsh
        run: ./tools/build-windows-installer-preview.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installer-preview-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-preview/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-update-pair-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swu/pair/
          if-no-files-found: error
          retention-days: 7

  windows-arm64-installer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'windows-support'
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SITUATE_WINDOWS_INSTALLER_TARGET: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python tools/pipeline-bootstrap.py
      - name: Build unsigned ARM64 installer preview
        shell: pwsh
        run: ./tools/build-windows-installer-preview.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installer-preview-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installer-preview/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-update-pair-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swu/pair/
          if-no-files-found: error
          retention-days: 7

  architecture:
    name: Architecture documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: gem install asciidoctor --version 2.0.26 --no-document --user-install --bindir "$RUNNER_TEMP/bin"
      - run: python3 tools/build-architecture.py "$RUNNER_TEMP/architecture"
        env:
          ASCIIDOCTOR: ${{ runner.temp }}/bin/asciidoctor

  required:
    name: PR verification
    needs:
      [
        architecture,
        plan,
        policy,
        tooling,
        tooling-macos,
        docker-integration,
        frontend,
        rust,
        macos-code,
        browser,
        browser-webkit,
        macos-native,
        macos-compatibility,
        windows-native,
      ]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: needs.architecture.result != 'success'
        run: exit 1
      - run: python3 tools/pipeline-container.py actions aggregate --workflow verify
        env:
          PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
          PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
          PIPELINE_NEEDS: ${{ format('{{"plan":{{"result":{0}}},"policy":{1},"tooling":{2},"tooling-macos":{3},"docker-integration":{4},"frontend":{5},"rust":{6},"macos-code":{7},"browser":{8},"browser-webkit":{9},"macos-native":{10},"macos-compatibility":{11},"windows-native":{12}}}', toJSON(needs.plan.result), toJSON(needs.policy), toJSON(needs.tooling), toJSON(needs.tooling-macos), toJSON(needs.docker-integration), toJSON(needs.frontend), toJSON(needs.rust), toJSON(needs.macos-code), toJSON(needs.browser), toJSON(needs.browser-webkit), toJSON(needs.macos-native), toJSON(needs.macos-compatibility), toJSON(needs.windows-native)) }}
      - run: python3 tools/pipeline-bootstrap.py
      - id: evidence
        run: node tools/actions-adapter.mjs source-evidence --workflow verify
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
          PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
          PIPELINE_NEEDS: ${{ format('{{"plan":{{"result":{0}}},"policy":{1},"tooling":{2},"tooling-macos":{3},"docker-integration":{4},"frontend":{5},"rust":{6},"macos-code":{7},"browser":{8},"browser-webkit":{9},"macos-native":{10},"macos-compatibility":{11},"windows-native":{12}}}', toJSON(needs.plan.result), toJSON(needs.policy), toJSON(needs.tooling), toJSON(needs.tooling-macos), toJSON(needs.docker-integration), toJSON(needs.frontend), toJSON(needs.rust), toJSON(needs.macos-code), toJSON(needs.browser), toJSON(needs.browser-webkit), toJSON(needs.macos-native), toJSON(needs.macos-compatibility), toJSON(needs.windows-native)) }}
      - if: steps.evidence.outputs.created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-digest: sha256:${{ steps.evidence.outputs.sha256 }}
          subject-name: evidence.json
          create-storage-record: false
      - id: evidence_artifact
        if: steps.evidence.outputs.created == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-verification-${{ github.run_attempt }}/evidence.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - if: steps.evidence.outputs.created == 'true'
        run: node tools/actions-adapter.mjs source-evidence-check --workflow verify
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
          PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
          PIPELINE_SOURCE_ARTIFACT_ID: ${{ steps.evidence_artifact.outputs.artifact-id }}
          PIPELINE_SOURCE_ARTIFACT_SHA256: ${{ steps.evidence_artifact.outputs.artifact-digest }}
          PIPELINE_SOURCE_EVIDENCE_FILE: ${{ steps.evidence.outputs.path }}
