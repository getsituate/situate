name: Release macOS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'getsituate/situate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: macos-release
    outputs:
      enabled: ${{ steps.selection.outputs.enabled }}
      plan: ${{ steps.plan.outputs.plan }}
      digest: ${{ steps.plan.outputs.digest }}
      app_impact: ${{ steps.plan.outputs.app_impact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - id: selection
        run: node tools/actions-adapter.mjs release-selection --workflow create
        env:
          PIPELINE_RELEASE_ENABLED: ${{ vars.MACOS_RELEASE_ENABLED }}
      - id: plan
        if: steps.selection.outputs.enabled == 'true'
        run: python3 tools/pipeline-container.py actions plan --workflow create
        env:
          GH_TOKEN: ${{ github.token }}

  policy:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && contains(fromJSON(needs.plan.outputs.plan || '{"lanes":[]}').lanes.*.id, 'policy')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow create --lane policy

  tooling:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && contains(fromJSON(needs.plan.outputs.plan || '{"lanes":[]}').lanes.*.id, 'tooling')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: lane
        run: python3 tools/pipeline-container.py actions lane --workflow create --lane tooling

  tooling-macos:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && contains(fromJSON(needs.plan.outputs.plan || '{"lanes":[]}').lanes.*.id, 'tooling-macos')
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs setup --workflow create --lane tooling-macos
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow create --lane tooling-macos

  docker-integration:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && contains(fromJSON(needs.plan.outputs.plan || '{"lanes":[]}').lanes.*.id, 'docker-integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      receipt: ${{ steps.lane.outputs.receipt }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs setup --workflow create --lane docker-integration
      - id: lane
        run: node tools/actions-adapter.mjs lane --workflow create --lane docker-integration

  frontend:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && contains(fromJSON(needs.plan.outputs.plan || '{"lanes":[]}').lanes.*.id, 'frontend')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
    outputs:
      receipt: ${{ steps.reuse.outputs.receipt || steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: reuse
        run: python3 tools/pipeline-container.py actions source-reuse --workflow create --lane frontend
        env:
          GH_TOKEN: ${{ github.token }}
      - id: lane
        if: steps.reuse.outputs.reused != 'true'
        run: python3 tools/pipeline-container.py actions lane --workflow create --lane frontend

  rust:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && contains(fromJSON(needs.plan.outputs.plan || '{"lanes":[]}').lanes.*.id, 'rust')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
    outputs:
      receipt: ${{ steps.reuse.outputs.receipt || steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: reuse
        run: python3 tools/pipeline-container.py actions source-reuse --workflow create --lane rust
        env:
          GH_TOKEN: ${{ github.token }}
      - id: lane
        if: steps.reuse.outputs.reused != 'true'
        run: python3 tools/pipeline-container.py actions lane --workflow create --lane rust

  macos-code:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && contains(fromJSON(needs.plan.outputs.plan || '{"lanes":[]}').lanes.*.id, 'macos-code')
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
    outputs:
      receipt: ${{ steps.reuse.outputs.receipt || steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs prepare-release-toolchain
      - id: reuse
        run: node tools/actions-adapter.mjs source-reuse --workflow create --lane macos-code
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.reuse.outputs.reused != 'true'
        run: node tools/actions-adapter.mjs setup --workflow create --lane macos-code
      - id: lane
        if: steps.reuse.outputs.reused != 'true'
        run: node tools/actions-adapter.mjs lane --workflow create --lane macos-code

  browser:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && contains(fromJSON(needs.plan.outputs.plan || '{"lanes":[]}').lanes.*.id, 'browser')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
    outputs:
      receipt: ${{ steps.reuse.outputs.receipt || steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: reuse
        run: python3 tools/pipeline-container.py actions source-reuse --workflow create --lane browser
        env:
          GH_TOKEN: ${{ github.token }}
      - id: lane
        if: steps.reuse.outputs.reused != 'true'
        run: python3 tools/pipeline-container.py actions lane --workflow create --lane browser

  macos-native:
    needs: plan
    if: needs.plan.outputs.enabled == 'true' && contains(fromJSON(needs.plan.outputs.plan || '{"lanes":[]}').lanes.*.id, 'macos-native')
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      attestations: read
      pull-requests: read
    outputs:
      receipt: ${{ steps.reuse.outputs.receipt || steps.lane.outputs.receipt }}
      evidence: ${{ steps.lane.outputs.evidence }}
    env:
      PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
      PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs prepare-release-toolchain
      - id: reuse
        run: node tools/actions-adapter.mjs source-reuse --workflow create --lane macos-native
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.reuse.outputs.reused != 'true'
        run: node tools/actions-adapter.mjs desktop
      - if: steps.reuse.outputs.reused != 'true'
        run: node tools/actions-adapter.mjs setup --workflow create --lane macos-native
      - id: lane
        if: steps.reuse.outputs.reused != 'true'
        run: node tools/actions-adapter.mjs lane --workflow create --lane macos-native

  required:
    name: Integrated verification
    needs:
      [
        plan,
        policy,
        tooling,
        tooling-macos,
        docker-integration,
        frontend,
        rust,
        macos-code,
        browser,
        macos-native,
      ]
    if: ${{ !cancelled() && needs.plan.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-container.py actions aggregate --workflow create
        env:
          PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
          PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
          PIPELINE_NEEDS: ${{ format('{{"plan":{{"result":{0}}},"policy":{1},"tooling":{2},"tooling-macos":{3},"docker-integration":{4},"frontend":{5},"rust":{6},"macos-code":{7},"browser":{8},"macos-native":{9}}}', toJSON(needs.plan.result), toJSON(needs.policy), toJSON(needs.tooling), toJSON(needs.tooling-macos), toJSON(needs.docker-integration), toJSON(needs.frontend), toJSON(needs.rust), toJSON(needs.macos-code), toJSON(needs.browser), toJSON(needs.macos-native)) }}

  create:
    name: Create GitHub Release
    needs:
      [
        plan,
        required,
        policy,
        tooling,
        tooling-macos,
        docker-integration,
        frontend,
        rust,
        macos-code,
        browser,
        macos-native,
      ]
    # Implicit success() rejects skipped lanes; the aggregate verifies selected receipts.
    if: ${{ !cancelled() && needs.plan.outputs.enabled == 'true' && needs.required.result == 'success' && needs.plan.outputs.app_impact == 'true' }}
    concurrency:
      group: situate-release-effects
      cancel-in-progress: false
    runs-on: macos-latest
    environment: macos-release
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      PIPELINE_RELEASE_ENABLED: ${{ vars.MACOS_RELEASE_ENABLED }}
      SITUATE_RELEASE_CONFIG_SHA256: ${{ vars.SITUATE_RELEASE_CONFIG_SHA256 }}
      WEBSITE_DEPLOY_HOST: ${{ vars.WEBSITE_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs release-gate --workflow create
      - run: node tools/actions-adapter.mjs desktop
      - run: node tools/actions-adapter.mjs create-prepare
        env:
          SITUATE_RELEASE_CONFIG_JSON: ${{ secrets.SITUATE_RELEASE_CONFIG_JSON }}
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.SITUATE_RELEASE_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.SITUATE_RELEASE_SSH_KNOWN_HOSTS }}
          PIPELINE_PLAN: ${{ needs.plan.outputs.plan }}
          PIPELINE_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
          PIPELINE_NEEDS: ${{ format('{{"plan":{{"result":{0}}},"policy":{1},"tooling":{2},"tooling-macos":{3},"docker-integration":{4},"frontend":{5},"rust":{6},"macos-code":{7},"browser":{8},"macos-native":{9}}}', toJSON(needs.plan.result), toJSON(needs.policy), toJSON(needs.tooling), toJSON(needs.tooling-macos), toJSON(needs.docker-integration), toJSON(needs.frontend), toJSON(needs.rust), toJSON(needs.macos-code), toJSON(needs.browser), toJSON(needs.macos-native)) }}
      - run: node tools/actions-adapter.mjs prepare-release-toolchain
      - id: cache_tool
        continue-on-error: true
        run: node tools/release-build-cache.mjs prepare
      - id: cache_plan
        if: steps.cache_tool.outcome == 'success'
        run: node tools/release-build-cache.mjs plan
      - id: cache_restore
        if: steps.cache_plan.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache_plan.outputs.paths }}
          key: ${{ steps.cache_plan.outputs.key }}
          restore-keys: ${{ steps.cache_plan.outputs.restore-key }}
      - run: node tools/actions-adapter.mjs prepare-release
      - run: node tools/actions-adapter.mjs create-stage --stage inputs
        env:
          PIPELINE_REQUIRE_LATEST_MAIN: "true"
          GH_TOKEN: ${{ github.token }}
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.SITUATE_RELEASE_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.SITUATE_RELEASE_SSH_KNOWN_HOSTS }}
      - id: cache_start
        if: steps.cache_plan.outputs.enabled == 'true'
        continue-on-error: true
        run: node tools/release-build-cache.mjs start
      - id: build
        run: node tools/actions-adapter.mjs create-stage --stage build
        env:
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.SITUATE_RELEASE_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.SITUATE_RELEASE_SSH_KNOWN_HOSTS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_MACOS_SIGNING_IDENTITY: ${{ secrets.APPLE_MACOS_SIGNING_IDENTITY }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          SITUATE_UPDATER_PUBLIC_KEY: ${{ vars.SITUATE_UPDATER_PUBLIC_KEY }}
          SITUATE_UPDATER_ENDPOINT: ${{ vars.SITUATE_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - id: cache_report
        if: always() && steps.cache_plan.outputs.enabled == 'true' && steps.cache_start.outcome == 'success'
        continue-on-error: true
        run: node tools/release-build-cache.mjs report
      - if: always() && steps.build.outcome == 'success' && steps.cache_report.outputs.flushed == 'true' && steps.cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.cache_plan.outputs.paths }}
          key: ${{ steps.cache_plan.outputs.key }}
      - run: node tools/actions-adapter.mjs create-stage --stage qualify
        env:
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.SITUATE_RELEASE_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.SITUATE_RELEASE_SSH_KNOWN_HOSTS }}
      - run: node tools/actions-adapter.mjs create-stage --stage github
        env:
          GH_TOKEN: ${{ github.token }}
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.SITUATE_RELEASE_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.SITUATE_RELEASE_SSH_KNOWN_HOSTS }}
