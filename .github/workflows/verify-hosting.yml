name: Verify hosting

on:
  pull_request:
    paths:
      - "infrastructure/production/**"
      - "infrastructure/releases/remote.py"
      - "infrastructure/website/config.mjs"
      - "tools/pipeline-bootstrap.py"
      - "client/docker/ci-volta.json"
      - "package.json"
      - ".github/workflows/verify-hosting.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/production/**"
      - "infrastructure/releases/remote.py"
      - "infrastructure/website/config.mjs"
      - "tools/pipeline-bootstrap.py"
      - "client/docker/ci-volta.json"
      - "package.json"
      - ".github/workflows/verify-hosting.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - name: Test production plan guards and release handoff
        run: |
          node --test infrastructure/production/{continuous-rollout,immutable-plan,rollout-journal,rollout-reconcile,terraform}.test.mjs infrastructure/production/immutable/{enrollment,probe}.test.mjs
          python3 -B -m unittest discover -s infrastructure/production/immutable
      - name: Check serving configuration and scripts
        run: |
          docker compose -f infrastructure/production/immutable/compose.yaml config --quiet
          shellcheck infrastructure/production/immutable/{bake,state,verify-boot}.sh
