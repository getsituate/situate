name: Dependency audit

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency vulnerabilities (${{ matrix.ecosystem }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [npm, cargo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18
        with:
          volta-version: 2.0.2
      - id: image
        uses: ./.github/actions/ci-image
      - name: Audit locked dependencies
        env:
          CI_IMAGE: ${{ steps.image.outputs.image }}
          ECOSYSTEM: ${{ matrix.ecosystem }}
        run: |
          if test "$ECOSYSTEM" = npm; then check=audit; else check=rust-audit; fi
          docker run --rm --init --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            -e HOME=/tmp/audit-home -e CARGO_HOME=/tmp/audit-cargo \
            -e npm_config_cache=/tmp/audit-npm \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            "$CI_IMAGE" bash -euo pipefail -c \
            'mkdir -p "$HOME" "$CARGO_HOME" "$npm_config_cache"; source /opt/ci-tools/ci-user.sh; exec node tools/quality.mjs "$1"' audit "$check"
