name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Test scope
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ inputs.mode || github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      linux: ${{ steps.select.outputs.linux }}
      docker: ${{ steps.select.outputs.docker }}
      host: ${{ steps.select.outputs.host }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18
        with:
          volta-version: 2.0.2
      - name: Check branch commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          args=(--head "$HEAD_SHA")
          if test -n "$BASE_SHA" && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--base "$BASE_SHA")
          fi
          node tools/commit-check.mjs "${args[@]}"
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode || 'full' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          case "$EVENT" in
            pull_request)
              args=(--mode changes --base "$BASE_SHA")
              if test "$DRAFT" = true; then args+=(--draft); fi
              ;;
            push)
              args=(--mode quick)
              if test -n "$BASE_SHA" && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
                args+=(--base "$BASE_SHA")
              fi
              ;;
            *) args=(--mode "$MODE") ;;
          esac
          node tools/ci-selection.mjs "${args[@]}" --output

  quick:
    name: Quick checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18
        with:
          volta-version: 2.0.2
      - uses: ./.github/actions/ci-image
      - id: cache
        uses: ./.github/actions/download-cache
        with:
          group: quick
          revision: ${{ hashFiles('tools/ci-image.lock.json', 'package-lock.json', 'client/package-lock.json', 'requirements/package-lock.json', 'client/Cargo.lock') }}
      - name: Run quick checks
        env:
          SITUATE_CI_SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          mkdir -p test-results
          node tools/ci-container.mjs --shard quick > test-results/quick.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quick-results
          path: test-results/
          retention-days: 7
      - uses: ./.github/actions/download-cache
        with:
          phase: save
          group: quick
          revision: ${{ steps.cache.outputs.revision }}
          hit: ${{ steps.cache.outputs.hit }}

  linux:
    name: Linux (${{ matrix.shard }})
    needs: [plan, quick]
    if: needs.plan.outputs.linux != '[]'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.linux) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18
        with:
          volta-version: 2.0.2
      - uses: ./.github/actions/ci-image
      - id: cache
        uses: ./.github/actions/download-cache
        with:
          group: ${{ matrix.shard }}
          revision: ${{ hashFiles('tools/ci-image.lock.json', 'package-lock.json', 'client/package-lock.json', 'requirements/package-lock.json', 'client/Cargo.lock') }}
      - name: Run the registered suite shard
        env:
          SITUATE_CI_SELECTION: ${{ needs.plan.outputs.selection }}
        shell: bash
        run: |
          mkdir -p test-results
          node tools/ci-container.mjs --shard "${{ matrix.shard }}" > test-results/host.json 2> >(tee test-results/host.log >&2)
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-${{ matrix.shard }}-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
      - uses: ./.github/actions/download-cache
        with:
          phase: save
          group: ${{ matrix.shard }}
          revision: ${{ steps.cache.outputs.revision }}
          hit: ${{ steps.cache.outputs.hit }}

  docker:
    name: Docker build context
    needs: [plan, quick]
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18
        with:
          volta-version: 2.0.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Verify Docker inputs on the host
        env:
          SITUATE_CI_SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          mkdir -p test-results
          node tools/ci-shard.mjs --shard docker --timeout 600 --json > test-results/docker.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docker-context-results
          path: test-results/
          retention-days: 7

  host:
    name: Apple host tests (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18
        with:
          volta-version: 2.0.2
      - id: cache
        uses: ./.github/actions/download-cache
        with:
          group: host
          revision: ${{ hashFiles('client/.node-version', 'client/rust-toolchain.toml', 'client/package-lock.json', 'client/Cargo.lock') }}
      - id: build-cache
        uses: ./.github/actions/rust-build-cache
        with:
          group: host
      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix client
        env:
          npm_config_cache: ${{ runner.temp }}/situate-downloads/npm
      - name: Install product browsers
        working-directory: client
        run: npx playwright install chromium webkit
      - name: Product functional browser tests
        working-directory: client
        run: npm run test:browser -- --forbid-only
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apple-browser-diagnostics
          path: client/test-results/browser/
          retention-days: 7
          if-no-files-found: ignore
      - name: Rust core and host tests
        working-directory: client
        env:
          CARGO_HOME: ${{ runner.temp }}/situate-downloads/cargo
        run: cargo test --workspace --locked --no-fail-fast -- --show-output --test-threads=1
      - name: Rust host lint
        working-directory: client
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          CARGO_HOME: ${{ runner.temp }}/situate-downloads/cargo
      - name: Native workspace fixture journeys
        working-directory: client
        env:
          CARGO_HOME: ${{ runner.temp }}/situate-downloads/cargo
        run: node scripts/test-native.mjs
      - name: Native agent fixture journey
        run: node client/scripts/test-agent-e2e.mjs --build-timeout 1800
        env:
          CARGO_HOME: ${{ runner.temp }}/situate-downloads/cargo
      - name: Native onboarding fixture journey
        run: node client/scripts/test-agent-e2e.mjs --journey onboarding --build-timeout 1800
        env:
          CARGO_HOME: ${{ runner.temp }}/situate-downloads/cargo
      - name: Native plugin fixture journey
        run: node client/scripts/test-agent-e2e.mjs --journey plugins --provider fixture --max-requests 7 --build-timeout 1800
        env:
          CARGO_HOME: ${{ runner.temp }}/situate-downloads/cargo
      - name: Development terminal tests and lint
        working-directory: tools/dev-tui
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
        env:
          CARGO_HOME: ${{ runner.temp }}/situate-downloads/cargo
      - name: Host script tests
        shell: bash
        run: node --test tools/test.test.mjs tools/test.integration.test.mjs client/scripts/*.test.mjs
      - uses: ./.github/actions/swift-tools
      - name: Apple source and workspace access checks
        run: |
          node tools/quality.mjs swift
          node client/scripts/test-workspace-access-swift.mjs
          swift test --package-path client/app/src-tauri/dictation --disable-automatic-resolution
      - uses: ./.github/actions/download-cache
        with:
          phase: save
          group: host
          revision: ${{ steps.cache.outputs.revision }}
          hit: ${{ steps.cache.outputs.hit }}
      - uses: ./.github/actions/rust-build-cache
        with:
          phase: save
          group: host
          key: ${{ steps.build-cache.outputs.key }}
          hit: ${{ steps.build-cache.outputs.hit }}

  security:
    name: Git history secret scan
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18
        with:
          volta-version: 2.0.2
      - uses: ./.github/actions/ci-image
      - run: node tools/ci-container.mjs --shard history

  required:
    name: Required host quality
    if: always()
    needs: [plan, quick, linux, docker, host, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18
        with:
          volta-version: 2.0.2
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node tools/ci-required.mjs
