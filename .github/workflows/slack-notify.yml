name: Send a Slack notification

on:
  workflow_call:
    inputs:
      kind:
        type: string
        required: true
      workflow_name:
        type: string
      run_id:
        type: number
      run_attempt:
        type: number
      release_id:
        type: string
    secrets:
      webhook_url:
        required: false

permissions:
  contents: read

jobs:
  send:
    if: github.repository == 'getsituate/situate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Slack webhook configuration
        id: webhook
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.webhook_url }}
        run: |
          if [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compose Slack message
        id: message
        if: steps.webhook.outputs.configured == 'true'
        continue-on-error: true
        shell: bash
        env:
          KIND: ${{ inputs.kind }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
          GH_TOKEN: ${{ inputs.kind == 'release' && github.token || '' }}
        run: |
          payload="$RUNNER_TEMP/slack-message.json"
          case "$KIND" in
            failure)
              [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              jq -n --arg workflow "$WORKFLOW_NAME" --arg attempt "$RUN_ATTEMPT" \
                --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" '
                def header($text): {type: "header", text: {type: "plain_text", text: $text}};
                def section($text): {type: "section", text: {type: "plain_text", text: $text}};
                {
                  text: "\($workflow[:200]) failed on main (attempt \($attempt))",
                  mrkdwn: false, unfurl_links: false, unfurl_media: false,
                  blocks: [
                    header("Workflow failed on main"),
                    section("\($workflow[:200]) · attempt \($attempt)"),
                    {type: "section", text: {type: "mrkdwn", text: "<\($url)|Open failed run>"}}
                  ]
                }' > "$payload"
              ;;
            release)
              [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
              release="$RUNNER_TEMP/slack-release.json"
              reasons="$RUNNER_TEMP/slack-release-reasons.jsonl"
              gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$release"
              collect_reasons() {
                local metadata asset source input_sha tag inputs fragments file sha blob
                metadata=$(jq -er --arg repo "$GITHUB_REPOSITORY" --arg id "$RELEASE_ID" '
                  select((.id | tostring) == $id and .draft == false and (.published_at | type) == "string")
                  | .tag_name as $tag
                  | [.assets[] | select(.name == "release-inputs.json") | .id | tostring] as $assets
                  | select(($assets | length) == 1 and ($assets[0] | test("^[1-9][0-9]*$")))
                  | [(.body // "" | scan("<!-- situate-release:([A-Za-z0-9+/=]+) -->") | .[0])] as $markers
                  | select(($markers | length) == 1)
                  | ($markers[0] | @base64d | fromjson | .identity)
                  | select(.repository == $repo and .tag == $tag and ("v" + .version) == $tag
                      and (.sourceRevision | test("^[a-f0-9]{40}$")) and (.inputSha256 | test("^[a-f0-9]{64}$")))
                  | [$assets[0], .sourceRevision, .inputSha256, $tag] | @tsv' "$release") || return 1
                IFS=$'\t' read -r asset source input_sha tag <<< "$metadata"
                inputs="$RUNNER_TEMP/slack-release-inputs.json"
                gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$inputs" || return 1
                printf '%s  %s\n' "$input_sha" "$inputs" | sha256sum --check --status || return 1
                fragments=$(jq -er --arg source "$source" --arg tag "$tag" '
                  select(.schemaVersion == 1 and .kind == "situate-release-inputs" and .source == $source and .tag == $tag)
                  | select((.fragments | type) == "array" and all(.fragments[];
                      (.path | test("^changes/[a-z][a-z0-9-]{0,79}\\.json$")) and (.sha256 | test("^[a-f0-9]{64}$"))))
                  | [.fragments[] | [.path, .sha256] | @tsv] | join("\n")' "$inputs") || return 1
                [[ -n "$fragments" ]] || return 0
                blob="$RUNNER_TEMP/slack-release-fragment.json"
                while IFS=$'\t' read -r file sha; do
                  gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/$file?ref=$source" > "$blob" || return 1
                  printf '%s  %s\n' "$sha" "$blob" | sha256sum --check --status || return 1
                  jq -c 'if has("emptyReason") then .emptyReason else empty end' "$blob" || return 1
                done <<< "$fragments"
              }
              if ! collect_reasons 2>/dev/null > "$reasons"; then
                : > "$reasons"
                echo '::warning::Internal changelog reasons could not be read.'
              fi
              jq -e --arg id "$RELEASE_ID" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/" --slurpfile reasons "$reasons" '
                def release_notes:
                  gsub("<!-- situate-release:[A-Za-z0-9+/=]+ -->"; "")
                  | gsub("\r\n"; "\n")
                  | gsub("^\\s+|\\s+$"; "")
                  | gsub("(?m)^(?<heading>### [^\n]+)\n\n"; "\(.heading)\n");
                def notes_block:
                  {type: "rich_text", elements: [{type: "rich_text_section", elements: [
                    scan("[^\n]+|\n+")
                    | if startswith("### ") then {type: "text", text: ("• " + .[4:]), style: {bold: true}}
                      elif startswith("## ") then {type: "text", text: .[3:], style: {bold: true}}
                      else {type: "text", text: .} end
                  ]}]};
                select((.id | tostring) == $id and .draft == false
                  and (.published_at | type) == "string" and (.tag_name | type) == "string" and .tag_name != "")
                | (.body // "" | release_notes) as $notes
                | ("Situate " + .tag_name + " published") as $title
                | ($url + (.tag_name | @uri)) as $release_url
                # Slack does not document a rich_text limit. Leave room for block overhead.
                | 8000 as $notes_limit
                | (($notes | length) > $notes_limit) as $shortened
                | "Release notes shortened." as $notice
                | (if $shortened then $notes[:($notes_limit - 1)] + "…" else $notes end) as $preview
                | {
                    text: (if $shortened then "\($title). \($notice) Full changelog: \($release_url)" else $title end),
                    mrkdwn: false, unfurl_links: false, unfurl_media: false,
                    blocks: (
                      [{type: "header", text: {type: "plain_text", text: $title[:120]}}]
                      + (if $shortened then [{type: "section", text: {
                          type: "mrkdwn", text: "\($notice) <\($release_url)|Read the full changelog on GitHub>"
                        }}] else [] end)
                      + (if $preview == "" then [] else [$preview | notes_block] end)
                      + (if ($reasons | length) == 0 then [] else
                           ("Internal changes without public notes\n" + ($reasons | map("• " + .) | join("\n"))) as $internal
                           | [{type: "section", text: {type: "plain_text", text:
                               (if ($internal | length) > 3000 then $internal[:2999] + "…" else $internal end)}}]
                         end)
                      + (if $shortened then [] else [{type: "section", text: {
                          type: "mrkdwn", text: "<\($release_url)|View release on GitHub>"
                        }}] end)
                    )
                  }' "$release" > "$payload"
              ;;
            *) exit 1 ;;
          esac
      - name: Post to Slack
        id: post
        if: steps.message.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.webhook_url }}
        run: |
          [[ "$SLACK_WEBHOOK_URL" =~ ^https://hooks\.slack\.com/services/[A-Za-z0-9]+/[A-Za-z0-9]+/[A-Za-z0-9]+$ ]]
          response=$(printf 'url = "%s"\n' "$SLACK_WEBHOOK_URL" |
            curl --disable --config - --silent --fail --max-time 20 \
              --header 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/slack-message.json")
          [[ "$response" == "ok" ]]
      - name: Report notification failure
        if: steps.message.outcome == 'failure' || steps.post.outcome == 'failure'
        run: echo "::warning::Slack notification could not be sent."
