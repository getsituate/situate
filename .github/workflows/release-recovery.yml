name: Release recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact existing creation operation
        required: true
        type: string
      action:
        description: Inspect checkpoints or authorize a separate recovery step
        required: true
        type: choice
        options: [inspect, qualify, continue]
      checkpoint:
        description: Build checkpoint for qualification or passed attempt for continuation
        required: false
        type: string
      draft_id:
        description: Existing empty GitHub draft ID for an interrupted creation
        required: false
        type: string
      confirmation:
        description: Digest from a fresh inspection of this operation
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect release checkpoints
    if: github.repository == 'getsituate/situate' && github.ref == 'refs/heads/main' && inputs.action == 'inspect'
    environment: release-recovery
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RECOVERY_WORKFLOW: create
      RECOVERY_OPERATION: ${{ inputs.operation }}
      RECOVERY_ACTION: ${{ inputs.action }}
      RECOVERY_CHECKPOINT: ${{ inputs.checkpoint }}
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      WEBSITE_DEPLOY_HOST: ${{ vars.WEBSITE_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs recovery
        env:
          GH_TOKEN: ${{ github.token }}
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.SITUATE_RELEASE_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.SITUATE_RELEASE_SSH_KNOWN_HOSTS }}

  qualify:
    name: Qualify retained macOS package
    if: github.repository == 'getsituate/situate' && github.ref == 'refs/heads/main' && inputs.action == 'qualify'
    environment: release-recovery
    runs-on: macos-latest
    timeout-minutes: 90
    concurrency:
      group: situate-release-effects
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      RECOVERY_WORKFLOW: create
      RECOVERY_OPERATION: ${{ inputs.operation }}
      RECOVERY_ACTION: ${{ inputs.action }}
      RECOVERY_CHECKPOINT: ${{ inputs.checkpoint }}
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      WEBSITE_DEPLOY_HOST: ${{ vars.WEBSITE_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs desktop
      - run: node tools/actions-adapter.mjs recovery
        env:
          GH_TOKEN: ${{ github.token }}
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.SITUATE_RELEASE_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.SITUATE_RELEASE_SSH_KNOWN_HOSTS }}

  continue:
    name: Continue GitHub Release
    if: github.repository == 'getsituate/situate' && github.ref == 'refs/heads/main' && inputs.action == 'continue'
    environment: release-recovery
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: situate-release-effects
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      RECOVERY_DRAFT_ID: ${{ inputs.draft_id }}
      RECOVERY_WORKFLOW: create
      RECOVERY_OPERATION: ${{ inputs.operation }}
      RECOVERY_ACTION: ${{ inputs.action }}
      RECOVERY_CHECKPOINT: ${{ inputs.checkpoint }}
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      WEBSITE_DEPLOY_HOST: ${{ vars.WEBSITE_DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/pipeline-bootstrap.py
      - run: node tools/actions-adapter.mjs recovery
        env:
          GH_TOKEN: ${{ github.token }}
          SITUATE_RELEASE_SSH_PRIVATE_KEY: ${{ secrets.SITUATE_RELEASE_SSH_PRIVATE_KEY }}
          SITUATE_RELEASE_SSH_KNOWN_HOSTS: ${{ secrets.SITUATE_RELEASE_SSH_KNOWN_HOSTS }}
