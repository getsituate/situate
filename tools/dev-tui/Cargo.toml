[package]
name = "situate-dev"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
nix = { version = "0.31", features = ["signal", "process"] }
strip-ansi-escapes = "0.2"
tempfile = "3"

[dev-dependencies]
vt100 = "0.16"
nix = { version = "0.31", features = ["term", "fs"] }
