[package]
name = "situate-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "situate_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }
url = "2"

[dependencies]
situate-core = { path = "../../crates/situate-core" }
situate-migrations = { path = "../../crates/situate-migrations" }
situate-agent = { path = "../../crates/situate-agent" }
tauri = { version = "=2.12.3", features = [] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
cap-std = "3"
cap-primitives = "3"
cap-fs-ext = "3"
percent-encoding = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3.23"
serde = { version = "1", features = ["derive"] }
tauri-plugin-workspace-access = { path = "../../crates/tauri-plugin-workspace-access" }
tauri-plugin-provider-platform = { path = "../../crates/tauri-plugin-provider-platform" }
tauri-plugin-executor-platform = { path = "../../crates/tauri-plugin-executor-platform" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util", "process"] }
tokio-util = "=0.7.19"
futures-util = "0.3"
dom_smoothie = "=0.19.0"
dom_query = { version = "=0.29.0", features = ["mini_selector"] }
encoding_rs = "0.8"
sha2 = "0.10"
rand = "0.8"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSLocale", "NSDateFormatter", "NSNumberFormatter", "NSFormatter"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"
system-configuration = "=0.7.0"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
plist = "1"
semver = "1"
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSValue"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSGraphicsContext", "NSView", "NSWindow", "NSTextCheckingClient", "objc2-core-graphics"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "block2", "objc2-app-kit", "objc2-core-foundation"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGImage"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17"

[dev-dependencies]
tauri = { version = "=2.12.3", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []
