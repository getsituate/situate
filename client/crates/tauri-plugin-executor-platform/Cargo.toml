[package]
name = "tauri-plugin-executor-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
links = "tauri-plugin-executor-platform"

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSValue"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSGraphicsContext", "NSView", "NSWindow", "NSTextCheckingClient", "objc2-core-graphics"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "block2", "objc2-app-kit", "objc2-core-foundation"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGImage"] }

[build-dependencies]
tauri-plugin = { version = "=2.7.2", features = ["build"] }
