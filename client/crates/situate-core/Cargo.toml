[package]
name = "situate-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
situate-host = { path = "../situate-host" }
situate-host-api = { path = "../situate-host-api" }
situate-migrations = { path = "../situate-migrations" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3.23"
cap-std = "3"
cap-primitives = "3"
cap-fs-ext = "3"
same-file = "1"
sha1collisiondetection = { version = "0.3.4", default-features = false, features = ["std"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
yaml-rust2 = "0.13"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
uuid = { version = "1", features = ["v4"] }
chacha20poly1305 = "=0.10.1"
zeroize = "=1.8.2"

[dev-dependencies]
situate-host = { path = "../situate-host", features = ["test-support"] }
