[package]
name = "situate-host-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
situate-host-api = { path = "../situate-host-api" }
tokio-util = "=0.7.19"
dunce = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "=0.62.2", features = ["Networking_Connectivity", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Variant"] }
cap-std = "3"
cap-fs-ext = "3"
same-file = "1"
winreg = "=0.55.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
cap-primitives = "3"
tempfile = "3.23"

[features]
test-support = []
