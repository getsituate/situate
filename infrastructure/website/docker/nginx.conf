user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    log_not_found off;
    server_tokens off;
    sendfile on;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://eocampaign1.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://gallery.eo.page; font-src 'self' https://fonts.gstatic.com https://gallery.eo.page; connect-src 'self' https://eocampaign1.com https://www.google.com/recaptcha/ https://eu.i.posthog.com; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "no-cache" always;

        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location ~ /\. {
            return 404;
        }

        location ~ ^/system(/|/index\.html)?$ {
            return 308 /;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
