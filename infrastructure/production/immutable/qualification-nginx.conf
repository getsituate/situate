server {
    listen 8081;
    server_name getsituate.com;
    root /srv/distribution/.qualification-view;
    autoindex off;
    disable_symlinks on;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        return 204;
    }

    location = /releases/current/update.json {
        default_type application/json;
        try_files $uri =404;
    }

    location ~ "^/releases/\.qualification/[a-f0-9]{64}/identity\.json$" {
        default_type application/json;
        try_files $uri =404;
    }

    location ~ ^/releases/[0-9]+\.[0-9]+\.[0-9]+/[A-Za-z0-9][A-Za-z0-9._+-]*\.(dmg|tar\.gz|sig)$ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
