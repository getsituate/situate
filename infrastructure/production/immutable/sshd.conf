PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
X11Forwarding no
Include /etc/ssh/situate-host-cert.conf
AllowUsers deploy situate-ops situate-website

Match User deploy
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:24443
Match all
