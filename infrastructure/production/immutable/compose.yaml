name: situate-immutable

services:
  website:
    image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    pull_policy: never
    user: "101:101"
    read_only: true
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /srv/situate-state/website
        target: /srv/website
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /opt/situate
        target: /srv/distribution
        read_only: true
        bind: { create_host_path: false }
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /tmp:uid=101,gid=101,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
  caddy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    pull_policy: never
    read_only: true
    depends_on:
      website:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /srv/situate-state/tls
        target: /data
        bind: { create_host_path: false }
    tmpfs: [/tmp, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
